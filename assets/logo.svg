<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0a09"/>
      <stop offset="40%" style="stop-color:#1c1917"/>
      <stop offset="100%" style="stop-color:#292524"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.45"/>
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#0c0a09;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.5">
    <ellipse cx="600" cy="280" rx="220" ry="220"/>
    <ellipse cx="600" cy="280" rx="280" ry="160" transform="rotate(-18 600 280)"/>
    <ellipse cx="600" cy="280" rx="160" ry="280" transform="rotate(25 600 280)"/>
  </g>
  <g fill="#c4b5fd">
    <circle cx="420" cy="180" r="5" opacity="0.8"/>
    <circle cx="780" cy="200" r="4" opacity="0.7"/>
    <circle cx="500" cy="400" r="3.5" opacity="0.6"/>
    <circle cx="720" cy="380" r="5" opacity="0.75"/>
    <circle cx="380" cy="300" r="3" opacity="0.5"/>
    <circle cx="820" cy="300" r="3.5" opacity="0.55"/>
  </g>
  <g filter="url(#soft)" transform="translate(600,280)">
    <ellipse cx="0" cy="0" rx="90" ry="52" fill="#1c1917" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="0" cy="0" r="36" fill="url(#eye)"/>
    <circle cx="0" cy="0" r="16" fill="#0c0a09"/>
    <circle cx="-8" cy="-8" r="6" fill="#fef3c7" opacity="0.9"/>
    <g stroke="#7c3aed" stroke-width="1" opacity="0.5">
      <line x1="-70" y1="-15" x2="70" y2="-15"/>
      <line x1="-80" y1="0" x2="80" y2="0"/>
      <line x1="-70" y1="15" x2="70" y2="15"/>
    </g>
  </g>
  <text x="600" y="520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#fafaf9">Sublima Decryptor</text>
  <text x="600" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#a78bfa">A Luz que Revela o que está Oculto</text>
  <text x="600" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#78716c">Forense · Esteganografia · Semiótica</text>
</svg>
